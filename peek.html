<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>%E2%9C%A8</text></svg>">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0b0f14;color:#e6edf3;
  font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-user-select:none;user-select:none}

.wrap{flex:1;display:flex;flex-direction:column;min-height:0}
.head{display:flex;align-items:center;gap:9px;padding:16px 18px 10px}
.head h1{font-size:20px;font-weight:650;margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:#f85149;flex:none;margin-left:auto}
.dot.on{background:#3fb950}
.head .st{font-size:11px;color:#6b7684}

.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 10px}
.row{padding:13px 18px;border-bottom:1px solid #161c25;display:flex;flex-direction:column;gap:3px}
.row.new{animation:flash 1.4s ease-out}
@keyframes flash{0%{background:#14304a}100%{background:transparent}}
.row .t{font-size:16px;font-weight:550;word-break:break-word}
.row.top .t{font-size:21px;font-weight:700}
.row .m{font-size:12px;color:#6b7684}
.empty{flex:1;display:flex;align-items:center;justify-content:center;color:#3a4452;
  font-size:14px;text-align:center;padding:0 30px}

.bar{display:flex;gap:8px;padding:11px 16px;border-top:1px solid #1f2733;align-items:center}
.bar input{flex:1;min-width:0;font:inherit;font-size:12px;background:#1b232d;border:1px solid #2a3442;
  color:#e6edf3;border-radius:8px;padding:9px 11px;font-family:ui-monospace,Consolas,monospace}
.bar button{font:inherit;font-size:13px;padding:9px 13px;border-radius:8px;border:1px solid #2a3442;
  background:#1b232d;color:#e6edf3;cursor:pointer}
.bar button:active{background:#232d3a}

/* disguise cover */
#cover{position:absolute;inset:0;z-index:5;background:#0b0f14;padding:22px;display:none;flex-direction:column}
#cover.on{display:flex}
#cover h1{font-size:19px;font-weight:600;margin:6px 0 2px}
#cover .sub{color:#6b7684;font-size:13px}
#cover .empty{color:#3a4452}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1>Peek</h1>
      <span class="dot" id="dot"></span>
      <span class="st" id="st">connecting…</span>
    </div>
    <div class="feed" id="feed">
      <div class="empty" id="empty">Waiting for a search…<br>Open the search page and try one.</div>
    </div>
  </div>

  <div class="bar">
    <input id="apiIn" placeholder="relay URL (blank = this server)" aria-label="Relay URL">
    <button id="save">Set</button>
    <button id="disguise">Hide</button>
  </div>

  <!-- triple-tap the title to come back out -->
  <div id="cover">
    <h1 id="coverTitle">Notes</h1>
    <div class="sub">Grocery, ideas, to-do</div>
    <div class="empty" style="flex:1;display:flex;align-items:center;justify-content:center">No notes yet</div>
  </div>

<script src="peek.js"></script>
</body>
</html>
